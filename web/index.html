<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0866c6" />

    <title>NetPulse — Free Internet Speed Test (Download, Upload, Ping)</title>
    <meta
      name="description"
      content="Test your real internet speed for free: download, upload, ping, jitter, and bufferbloat under load — measured live in your browser, no sign-up required."
    />
    <!--
      REPLACE before launch: every absolute URL below (canonical, og:url,
      structured data "url") uses this placeholder. Google treats a canonical
      pointing at the wrong domain as a signal to ignore the page, and the
      Google Ads landing-page review checks that the URL you bid on actually
      resolves — both need the real production domain, not this one.
    -->
    <link rel="canonical" href="https://your-domain.example/" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NetPulse — Free Internet Speed Test" />
    <meta
      property="og:description"
      content="Test your real internet speed for free: download, upload, ping, jitter, and bufferbloat under load — measured live in your browser."
    />
    <meta property="og:url" content="https://your-domain.example/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NetPulse — Free Internet Speed Test" />
    <meta
      name="twitter:description"
      content="Test your real internet speed for free: download, upload, ping, jitter, and bufferbloat under load."
    />

    <!--
      WebApplication structured data: tells Google this is a free, usable tool
      (not an article or store listing), which is what the speed-test rich
      result / sitelinks treatment keys off. Browsers never execute
      application/ld+json as script, so this is unaffected by the page's
      strict script-src CSP.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NetPulse",
        "url": "https://your-domain.example/",
        "description": "Free internet speed test measuring download, upload, ping, jitter, and latency under load.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
