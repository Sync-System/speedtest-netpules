<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback: some crawlers and older browsers that fetch a site's
         favicon (including Google's SERP favicon slot, historically
         inconsistent about SVG) skip an SVG-only <link rel="icon">. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0866c6" />

    <!-- Trimmed from a 63-char version that also duplicated the metrics list
         already in the meta description: Google truncates titles around
         ~60 characters, and og:title/twitter:title below were already this
         shorter form — the <title> tag had drifted out of sync with them. -->
    <title>Speedtest4u — Free Internet Speed Test, No Sign-Up</title>
    <meta
      name="description"
      content="Test your real internet speed for free: download, upload, ping, jitter, and bufferbloat under load — measured live in your browser, no sign-up required."
    />
    <link rel="canonical" href="https://speedtest4u.com/" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Speedtest4u — Free Internet Speed Test" />
    <meta
      property="og:description"
      content="Test your real internet speed for free: download, upload, ping, jitter, and bufferbloat under load — measured live in your browser."
    />
    <meta property="og:url" content="https://speedtest4u.com/" />
    <meta property="og:site_name" content="Speedtest4u" />
    <meta property="og:locale" content="en_US" />
    <!-- Absolute URL required: crawlers for Facebook/Slack/WhatsApp/etc fetch
         this server-side, with no page context to resolve a relative path
         against. 1200x630 is the size every major platform (Facebook,
         LinkedIn, Slack, iMessage) crops straight to without letterboxing. -->
    <meta property="og:image" content="https://speedtest4u.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- summary_large_image, not summary: without it Twitter/X falls back to a
         small square crop of og:image regardless of its actual 1200x630 shape,
         which cuts off the wordmark and both gauge arcs. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Speedtest4u — Free Internet Speed Test" />
    <meta
      name="twitter:description"
      content="Test your real internet speed for free: download, upload, ping, jitter, and bufferbloat under load."
    />
    <meta name="twitter:image" content="https://speedtest4u.com/og-image.png" />

    <!--
      WebApplication structured data: tells Google this is a free, usable tool
      (not an article or store listing), which is what the speed-test rich
      result / sitelinks treatment keys off. Browsers never execute
      application/ld+json as script, so this is unaffected by the page's
      strict script-src CSP.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Speedtest4u",
        "url": "https://speedtest4u.com/",
        "description": "Free internet speed test measuring download, upload, ping, jitter, and latency under load.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!--
      FAQPage structured data — the path to an accordion rich result directly
      in Google's search listing, which meaningfully lifts click-through rate
      over a plain blue link. Every answer here must match the visible FAQ
      text in Footer.tsx word-for-word: Google requires structured data to
      reflect real on-page content, and a mismatch risks a manual action
      against rich-result eligibility rather than just losing it quietly.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is a good download speed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Roughly: 25 Mbps covers one HD stream comfortably, 100+ Mbps handles several 4K streams or a busy household, and gigabit (900+ Mbps) mainly matters for large file transfers rather than everyday browsing or video calls."
            }
          },
          {
            "@type": "Question",
            "name": "Why does upload speed matter?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Upload is what limits video calls, cloud backups, and livestreaming — it's typically far lower than download on most home connections, which is normal and expected, not a fault."
            }
          },
          {
            "@type": "Question",
            "name": "What is ping (latency)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "How long a signal takes to reach our server and back, in milliseconds. Lower is better — it's the number that determines whether a game or video call feels instant or laggy, independent of your Mbps."
            }
          },
          {
            "@type": "Question",
            "name": "What is jitter?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "How much your ping varies from one moment to the next. A connection with low ping but high jitter can still cause choppy calls, because packets arrive unevenly even though the average delay looks fine."
            }
          },
          {
            "@type": "Question",
            "name": "What does \"Under load\" (bufferbloat) mean?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your ping measured while the connection is busy downloading or uploading, instead of idle. A big jump — say 20ms idle to 400ms loaded — means your router is queuing data instead of sending it, and is why calls can lag specifically while something else is downloading in the background."
            }
          },
          {
            "@type": "Question",
            "name": "Why do my results change each time I test?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Server load, Wi-Fi interference, other devices on your network, and your ISP's own peak-hour congestion all shift the number run to run — true of every speed test, not just this one. Treat one result as a data point, and the History section as the more honest picture."
            }
          },
          {
            "@type": "Question",
            "name": "Is Speedtest4u free? Do I need an account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, and no. No sign-up, no app install, no payment — open the page and press GO."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
