<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250" role="img" aria-label="Paying for speed you're not getting? Compare broadband plans in your area.">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12213a"/>
      <stop offset="1" stop-color="#0d3b6b"/>
    </linearGradient>
  </defs>

  <rect width="300" height="250" rx="12" fill="url(#bg2)"/>

  <!-- Advertised vs actual, as bars. The gap IS the pitch: someone who has
       just seen their real number can compare it to what they pay for
       without reading a word. -->
  <text x="34" y="46" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="10.5" font-weight="700" fill="#7d97b5" letter-spacing="1.2">ADVERTISED</text>
  <rect x="34" y="54" width="232" height="12" rx="6" fill="#4d9bff"/>

  <text x="34" y="88" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="10.5" font-weight="700" fill="#7d97b5" letter-spacing="1.2">WHAT YOU GET</text>
  <rect x="34" y="96" width="232" height="12" rx="6" fill="#22334d"/>
  <rect x="34" y="96" width="97" height="12" rx="6" fill="#ff8a5f"/>

  <text x="150" y="147" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.4">Paying for speed</text>
  <text x="150" y="171" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.4">you never see?</text>

  <text x="150" y="192" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="13" fill="#a9c2dd">Check what else is available to you.</text>

  <rect x="86" y="206" width="128" height="32" rx="16" fill="#4d9bff"/>
  <text x="150" y="227" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="13.5" font-weight="700" fill="#05101d">Compare plans</text>
</svg>
