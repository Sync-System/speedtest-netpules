<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 90" width="728" height="90" role="img" aria-label="Slow result? Check these three things first. Wi-Fi distance, router age and peak-hour congestion explain most of them.">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2544"/>
      <stop offset="1" stop-color="#14406e"/>
    </linearGradient>
  </defs>

  <rect width="728" height="90" rx="12" fill="url(#bg3)"/>

  <!-- Signal bars rather than a gauge arc: three rects can't be got wrong,
       where an arc depends on large-arc/sweep flags that render as a stray
       near-circle the moment either is off — which is exactly what the first
       version of this file did. -->
  <g transform="translate(46 45)">
    <rect x="-16" y="2" width="7" height="12" rx="2.5" fill="#ff8a5f" opacity="0.35"/>
    <rect x="-5" y="-5" width="7" height="19" rx="2.5" fill="#ff8a5f" opacity="0.65"/>
    <rect x="6" y="-14" width="7" height="28" rx="2.5" fill="#ff8a5f"/>
  </g>

  <!-- Copy is length-budgeted to end before the CTA at x=592. SVG text neither
       wraps nor shrinks, so a sentence a few characters too long doesn't clip,
       it runs straight off the canvas and through the button. -->
  <text x="86" y="41" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.3">Slow result? Check these three things first.</text>
  <text x="86" y="64" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="13.5" fill="#a9c2dd">Wi-Fi distance, router age and peak-hour congestion explain most of them.</text>

  <rect x="592" y="29" width="104" height="32" rx="16" fill="#ff8a5f"/>
  <text x="644" y="50" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="13.5" font-weight="700" fill="#1c0c04">Read guide</text>
</svg>
