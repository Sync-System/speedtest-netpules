<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" role="img" aria-label="Slow result? Wi-Fi, router age and congestion explain most of them. Read the guide.">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2544"/>
      <stop offset="1" stop-color="#14406e"/>
    </linearGradient>
  </defs>

  <rect width="320" height="100" rx="12" fill="url(#bg4)"/>

  <g transform="translate(36 50)">
    <rect x="-13" y="1" width="6" height="11" rx="2" fill="#ff8a5f" opacity="0.35"/>
    <rect x="-4" y="-5" width="6" height="17" rx="2" fill="#ff8a5f" opacity="0.65"/>
    <rect x="5" y="-12" width="6" height="24" rx="2" fill="#ff8a5f"/>
  </g>

  <!-- The CTA sits inline on the right rather than under the copy: at 100px
       tall there isn't room to stack text and a button without one of them
       touching an edge. -->
  <text x="66" y="38" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="16" font-weight="800" fill="#ffffff" letter-spacing="-0.2">Slow result?</text>
  <text x="66" y="57" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="11" fill="#a9c2dd">Wi-Fi, router age and peak-hour</text>
  <text x="66" y="71" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="11" fill="#a9c2dd">congestion explain most of them.</text>

  <rect x="222" y="18" width="82" height="26" rx="13" fill="#ff8a5f"/>
  <text x="263" y="35" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="11.5" font-weight="700" fill="#1c0c04">Read guide</text>
</svg>
