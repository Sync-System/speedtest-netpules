name = "speedtest4u-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Deploy with:  npm run deploy -w worker      (wrangler will prompt to log in)
# Test locally: npm run dev -w worker         (serves on http://localhost:8788)
#
# To serve the API from the same origin as the site — which removes CORS
# entirely and lets the browser read Server-Timing without extra headers —
# uncomment the route below once speedtest4u.com is on Cloudflare with the
# orange (proxied) cloud enabled. The Worker then intercepts /api/* before the
# request ever reaches whatever hosts the static site.
#
# [[routes]]
# pattern = "speedtest4u.com/api/*"
# zone_name = "speedtest4u.com"

# Packet loss is OPTIONAL and off until these two secrets exist. Without them
# /api/turn-creds answers 501 and the UI simply omits the packet-loss tile —
# every other metric works exactly the same.
#
# Cloudflare's own turn-creds endpoint returns 403 off their domain, so the
# probe needs a TURN key of your own. Create one under Realtime -> TURN in the
# dashboard, then set both from YOUR terminal (they are secrets — never commit
# them, and never put them in [vars], which ships them to the client):
#
#   npx wrangler secret put TURN_KEY_ID       -w worker
#   npx wrangler secret put TURN_KEY_API_TOKEN -w worker

[observability]
enabled = true
